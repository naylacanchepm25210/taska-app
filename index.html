<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TASKA PRO</title><meta name="theme-color" content="#3b1a9e"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0d1020;--card:#1a1f36;--card2:#232945;--line:#343c63;--txt:#f1f4ff;--mut:#9aa4cf;--pri:#9b4dff;--pri2:#5b2bd9;--ok:#2ecc8f;--warn:#ffb020;--bad:#ff5470}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#05060d;color:var(--txt);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:440px;min-height:100vh;margin:auto;background:var(--bg);position:relative;padding-bottom:84px}
.hdr{background:linear-gradient(135deg,#3b1a9e,#8a3ffc);padding:16px 16px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
.hdr h1{flex:1;margin:0;font-size:20px;letter-spacing:.5px}
.ib{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:12px;width:38px;height:38px;font-size:17px;cursor:pointer}
.ib:active{transform:scale(.92)}
.wrap{padding:14px 16px}
h2{margin:6px 0 2px;font-size:18px}.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.wrapr{flex-wrap:wrap}.wrapr>*{flex:0 0 auto}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:30px}.stat span{color:var(--mut);font-size:12px}
button,.btn{font:inherit;cursor:pointer}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;color:#fff;font-weight:700;background:linear-gradient(135deg,var(--pri),var(--pri2));text-align:center;text-decoration:none}
.btn:active{transform:scale(.98)}.btn.sec{background:transparent;border:1.5px solid var(--pri);color:#c9a6ff}
.btn.red{background:var(--bad)}.btn.sm{padding:8px 12px;font-size:13px;width:auto;display:inline-block}
.btn[disabled]{opacity:.45}
.chip{border:1.5px solid var(--line);background:var(--card2);color:var(--txt);border-radius:999px;padding:8px 14px;font-size:13px;white-space:nowrap}
.chip.on{background:#fff;color:#111;border-color:#fff;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips.wrapc{flex-wrap:wrap;overflow:visible}
input,textarea,select{width:100%;background:var(--card2);color:var(--txt);border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--pri)}
label{display:block;margin:12px 0 6px;font-weight:600;font-size:13px;color:#cdd5ff}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:rgba(13,16,32,.96);backdrop-filter:blur(8px);padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px;border-top:1px solid var(--line);z-index:6}
.nav button{flex:1;border:1.5px solid var(--line);background:var(--card2);color:var(--txt);border-radius:999px;padding:11px 2px;font-size:12px;font-weight:600}
.nav button.on{background:#fff;color:#111;border-color:#fff}.nav button.plus{flex:.8;font-size:20px;background:linear-gradient(135deg,var(--pri),var(--pri2));border:0}
.task{display:flex;gap:10px;align-items:flex-start}.task .t{flex:1;min-width:0}.task b{word-break:break-word}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;background:#2b3566;color:#b9c6ff;margin-right:4px}
.s0{background:#4a2a3a;color:#ff9db0}.s1{background:#4a3d1c;color:#ffd27a}.s2{background:#1d4a3a;color:#7df0c0}
.late{color:var(--bad)}.soon{color:var(--warn)}.fine{color:var(--ok)}
.empty{text-align:center;color:var(--mut);padding:26px 8px}.empty b{display:block;color:var(--txt);margin-bottom:4px}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--ok))}
.auth{padding:26px 18px}.logo{font-size:34px;font-weight:800;text-align:center;background:linear-gradient(135deg,#5b9bff,#a58bff);-webkit-background-clip:text;background-clip:text;color:transparent;margin:10px 0 2px}
.rule{font-size:12.5px;margin:3px 0}.rule.ok{color:var(--ok)}.rule.no{color:var(--bad)}
.pw{position:relative}.pw button{position:absolute;right:6px;top:6px;background:none;border:0;color:var(--mut);font-size:18px;padding:6px}
.msg{font-size:13px;margin-top:6px;min-height:18px;font-weight:600}
.msg.ok{color:var(--ok)}.msg.no{color:var(--bad)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.show{display:flex}#modal .box{background:var(--card);width:100%;max-width:440px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px;border:1px solid var(--line)}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-weight:700;z-index:30;display:none;max-width:90%;box-shadow:0 8px 30px #0008}
.week{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.day{flex:1;min-width:46px;background:var(--card2);border:1.5px solid var(--line);border-radius:14px;padding:8px 2px;text-align:center;color:var(--txt);font-size:11px}
.day b{display:block;font-size:17px}.day.on{background:#fff;color:#111}.day.dot::after{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin:3px auto 0}
.col h3{margin:16px 0 2px;font-size:15px}.msgb{background:var(--card2);border-radius:12px;padding:8px 10px;margin:6px 0;font-size:13.5px}.msgb small{color:var(--mut)}
.apps{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.app{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 8px;text-align:center;color:var(--txt);text-decoration:none;font-weight:700}.app span{display:block;font-size:28px;margin-bottom:4px}
.x{background:none;border:0;color:var(--bad);font-size:16px;padding:4px 8px}
small.m{color:var(--mut)}

.hl{width:34px;height:34px;border-radius:50%}.navlogo{display:none}.authlogo{display:block;width:190px;max-width:60%;margin:0 auto 6px;border-radius:50%;box-shadow:0 0 40px #9b4dff77}
.cols{display:block}
@media(min-width:900px){
 body{background:#07040f}
 #app{max-width:none;padding:0 0 30px 230px}
 #app:has(.auth){padding:0}
 .nav{left:0;top:0;bottom:0;transform:none;width:230px;max-width:none;flex-direction:column;justify-content:flex-start;padding:18px 14px;border-top:0;border-right:1px solid var(--line);gap:10px}
 .nav button{flex:0 0 auto;padding:14px;font-size:15px;text-align:left;border-radius:14px}
 .nav button.plus{margin-top:6px;font-size:16px;padding:14px}.nav button.plus::after{content:' Nueva actividad';font-size:14px}
 .navlogo{display:block;width:150px;margin:0 auto 12px;border-radius:50%}
 .wrap{max-width:980px;margin:0 auto;padding:22px 28px}
 .hdr{padding:18px 28px}.hdr h1{font-size:22px}
 .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
 .apps{grid-template-columns:repeat(4,1fr)}
 #modal{align-items:center}#modal .box{max-width:520px;border-radius:22px}
 .auth{max-width:440px;margin:0 auto;padding-top:5vh}
 .btn:hover,.chip:hover,.nav button:hover{filter:brightness(1.15)}
}
</style>
</head>

/* ===== Datos ===== */
const uid=()=>Math.random().toString(36).slice(2,9);
const code=()=>Math.random().toString(36).slice(2,8).toUpperCase();
const H=s=>btoa(unescape(encodeURIComponent(s)));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D;try{D=JSON.parse(localStorage.getItem('taska_pro')||'null')}catch(e){D=null}
D=D||{users:[],tasks:[],subjects:{},teams:[],classes:[],files:{},session:null,notif:false};
const save=()=>{try{localStorage.setItem('taska_pro',JSON.stringify(D))}catch(e){}};
const me=()=>D.users.find(u=>u.email===D.session);
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const todayISO=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return iso(d)};
const daysLeft=s=>Math.round((new Date(s+'T00:00')-new Date(todayISO()+'T00:00'))/864e5);
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const fmt=s=>{const d=new Date(s+'T00:00');return d.getDate()+' '+MES[d.getMonth()].slice(0,3)};
const fmtL=s=>{const d=new Date(s+'T00:00');return DIAS[d.getDay()]+', '+d.getDate()+' de '+MES[d.getMonth()]};
const ST=['Pendiente','En proceso','Terminada'];
const mySubjects=()=>D.subjects[D.session]||[];
const myTeams=()=>D.teams.filter(t=>t.members.some(m=>m.email===D.session));
const visibleTasks=()=>D.tasks.filter(t=>t.author===D.session||t.assignee===D.session||(t.teamId&&myTeams().some(x=>x.id===t.teamId)));
const nameOf=e=>{const u=D.users.find(u=>u.email===e);if(u)return u.name;for(const t of D.teams){const m=t.members.find(m=>m.email===e);if(m)return m.name}return e||'—'};
const BASE=()=>{try{return location.href.split('#')[0]}catch(e){return ''}};

/* ===== UI estado ===== */
const V={auth:'login',tab:'tasks',filter:'all',cal:todayISO(),boardF:'all',teamTab:'all',team:null,cls:null,post:null,nf:null,edit:null,more:null};
const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function modal(h){$('#mbox').innerHTML=h;$('#modal').classList.add('show')}
function closeM(){$('#modal').classList.remove('show')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
function ask(msg,fn,label='Confirmar'){window._ok=fn;modal(`<h2>${esc(msg)}</h2><div class="row" style="margin-top:14px"><button class="btn sec" data-a="closeM">Cancelar</button><button class="btn red" data-a="okAsk">${label}</button></div>`)}

/* ===== Autenticación ===== */
const rules=p=>[['Mínimo 8 caracteres',p.length>=8],['Al menos una letra',/[A-Za-z]/.test(p)],['Al menos un número',/\d/.test(p)]];
function authView(){
 const m=V.auth;
 let h=`<div class="auth"><img class="authlogo" src="${LOGO}" alt="TASKA PRO"><p class="sub" style="text-align:center">Organiza tus tareas y trabaja en equipo.</p>`;
 if(m==='login'){h+=`<h2>Inicia sesión</h2><p class="sub">Accede con tu cuenta para revisar tus materias, calendario y actividades en equipo.</p>
 <label>Correo electrónico</label><input id="em" type="email" placeholder="alumno@colegio.edu" autocomplete="email">
 <label>Contraseña</label><div class="pw"><input id="pw" type="password" placeholder="Tu contraseña"><button data-a="eye" type="button">👁</button></div>
 <div class="msg" id="pwmsg"></div><div class="msg no" id="err"></div>
 <button class="btn" data-a="login" style="margin-top:8px">ENTRAR A TASKA PRO</button>
 <div class="row" style="margin-top:12px"><button class="btn sec sm" data-a="authm" data-v="forgot">¿Olvidaste tu contraseña?</button><button class="btn sec sm" data-a="authm" data-v="register">Crear cuenta</button></div>
 <p class="sub" style="text-align:center;margin-top:18px">Acceso rápido para desarrollo</p><button class="btn sec" data-a="guest">Continuar como invitado</button>`}
 if(m==='register'){h+=`<h2>Crear cuenta</h2><p class="sub">Regístrate para poder iniciar sesión.</p>
 <label>Nombre</label><input id="nm" placeholder="Tu nombre"><label>Correo electrónico</label><input id="em" type="email" placeholder="alumno@colegio.edu">
 <label>Contraseña</label><div class="pw"><input id="pw" type="password" placeholder="Crea una contraseña"><button data-a="eye" type="button">👁</button></div>
 <div id="rules"></div><label>Repite la contraseña</label><div class="pw"><input id="pw2" type="password" placeholder="Repite la contraseña"></div><div class="msg" id="pwmsg"></div><div class="msg no" id="err"></div>
 <button class="btn" data-a="register" style="margin-top:8px">REGISTRARME</button><button class="btn sec" data-a="authm" data-v="login" style="margin-top:10px">Ya tengo cuenta</button>`}
 if(m==='forgot'){h+=`<h2>Recuperar contraseña</h2><p class="sub">Escribe tu correo y elige una nueva contraseña.</p>
 <label>Correo electrónico</label><input id="em" type="email"><label>Nueva contraseña</label><div class="pw"><input id="pw" type="password"><button data-a="eye" type="button">👁</button></div><div id="rules"></div><div class="msg no" id="err"></div>
 <button class="btn" data-a="forgot">CAMBIAR CONTRASEÑA</button><button class="btn sec" data-a="authm" data-v="login" style="margin-top:10px">Volver</button>`}
 return h+'</div>'}
function liveAuth(){
 const pw=$('#pw'),em=$('#em');if(!pw)return;
 const r=$('#rules');
 if(r)r.innerHTML=rules(pw.value).map(([t,o])=>`<div class="rule ${o?'ok':'no'}">${o?'✓':'✗'} ${t}</div>`).join('');
 const msg=$('#pwmsg');if(!msg)return;
 if(V.auth==='login'){const u=D.users.find(u=>u.email===em.value.trim().toLowerCase());
  if(!pw.value||!u){msg.textContent='';return}
  const ok=u.pw===H(pw.value);msg.className='msg '+(ok?'ok':'no');msg.textContent=ok?'✓ Contraseña correcta':'✗ Contraseña incorrecta'}
 if(V.auth==='register'){const p2=$('#pw2');if(!p2.value){msg.textContent='';return}
  const ok=p2.value===pw.value;msg.className='msg '+(ok?'ok':'no');msg.textContent=ok?'✓ Las contraseñas coinciden':'✗ Las contraseñas no coinciden'}}
function setErr(t){const e=$('#err');if(e)e.textContent=t}
const validEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
function doLogin(){const e=$('#em').value.trim().toLowerCase(),p=$('#pw').value;
 if(!validEmail(e))return setErr('Escribe un correo válido.');
 const u=D.users.find(u=>u.email===e);if(!u)return setErr('Ese correo no está registrado. Toca "Crear cuenta".');
 if(u.pw!==H(p))return setErr('Contraseña incorrecta.');
 D.session=e;save();V.tab='tasks';render();toast('¡Bienvenido, '+u.name+'!');checkJoinHash()}
function doRegister(){const n=$('#nm').value.trim(),e=$('#em').value.trim().toLowerCase(),p=$('#pw').value;
 if(!n)return setErr('Escribe tu nombre.');if(!validEmail(e))return setErr('Escribe un correo válido.');
 if(!rules(p).every(r=>r[1]))return setErr('La contraseña no cumple los requisitos.');

function doForgot(){const e=$('#em').value.trim().toLowerCase(),p=$('#pw').value;const u=D.users.find(u=>u.email===e);

 return frame('PERFIL',`<div class="card" style="text-align:center"><div style="width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));margin:auto;font-size:34px;font-weight:800;line-height:76px">${esc(u.name[0]||'?').toUpperCase()}</div><h2>${esc(u.name)}</h2><small class="m">${esc(u.email)}</small>
 <div class="row" style="margin-top:12px"><div class="stat"><b>${mine.length}</b><span>Creadas</span></div><div class="stat"><b>${mine.filter(t=>t.status===2).length}</b><span>Terminadas</span></div><div class="stat"><b>${myTeams().length}</b><span>Equipos</span></div></div></div>
 <div class="card"><b>Editar nombre</b><div class="row" style="margin-top:8px"><input id="pn" value="${esc(u.name)}" style="flex:3"><button class="btn sm" data-a="saveName" style="flex:1">Guardar</button></div></div>
 <div class="card"><b>Mis materias</b><div class="chips wrapc" style="margin-top:8px">${subs.map((s,i)=>`<span class="chip">${esc(s)} <button class="x" data-a="rmSubj" data-v="${i}">✕</button></span>`).join('')||'<small class="m">Sin materias aún</small>'}<button class="chip" data-a="addSubj">＋ Agregar</button></div></div>
 <div class="card"><b>Notificaciones</b><p class="sub">Avisos en tu teléfono de tareas por vencer (con la app abierta).</p><button class="btn sm" data-a="notif">🔔 ${D.notif?'Activadas ✔':'Activar'}</button></div>
 <button class="btn sec" data-a="logout">Cerrar sesión</button><button class="btn red" style="margin-top:10px" data-a="delAcc">Eliminar mi cuenta</button>`)}

/* ===== Render ===== */
function render(){
 const a=$('#app');
 if(!D.session||!me()){a.innerHTML=authView();liveAuth();return}
 const v={tasks:tasksView,cal:calView,board:boardView,team:teamView,new:newView,classes:classesView,apps:appsView,profile:profileView}[V.tab]||tasksView;
 a.innerHTML=v();window.scrollTo(0,0)}
const re=()=>{const y=window.scrollY;render();window.scrollTo(0,y)};

/* ===== Acciones ===== */
const isUrl=s=>/^https?:\/\/\S+\.\S+/i.test(s);
function addSubject(){modal(`<h2>Nueva materia</h2><input id="sj" placeholder="Ej. Matemáticas"><button class="btn" style="margin-top:12px" data-a="saveSubj">Agregar</button>`);setTimeout(()=>$('#sj')?.focus(),50)}
const A={
 closeM,okAsk(){closeM();window._ok&&window._ok()},
 eye(){const p=$('#pw');p.type=p.type==='password'?'text':'password'},
 authm(e,v){V.auth=v;render()},login:doLogin,register:doRegister,forgot:doForgot,guest,
 go(e,v){V.tab=v;V.cls=null;render();closeM()},
 newTask(){openNew()},
 filt(e,v){V.filter=v;render()},addSubj:addSubject,
 saveSubj(){const s=$('#sj').value.trim();if(!s)return;const l=mySubjects();if(l.some(x=>x.toLowerCase()===s.toLowerCase()))return toast('Esa materia ya existe');(D.subjects[D.session]=l).push(s);save();closeM();if(V.nf&&!V.nf.subject)V.nf.subject=s;re();toast('Materia agregada')},
 rmSubj(e,v){const s=mySubjects()[v];ask('¿Quitar la materia "'+s+'"? Las tareas se conservan.',()=>{D.subjects[D.session].splice(v,1);if(V.filter===s)V.filter='all';save();re()},'Quitar')},
 cycle(e){const t=D.tasks.find(x=>x.id===e.dataset.id);if(!t)return;t.status=(t.status+1)%3;save();re();toast(ST[t.status])},
 editTask(e){openNew(e.dataset.id)},
 delTask(e){const t=D.tasks.find(x=>x.id===e.dataset.id);if(!t||t.author!==D.session)return toast('Solo el autor puede eliminarla');ask('¿Eliminar "'+t.title+'"?',()=>{D.tasks=D.tasks.filter(x=>x.id!==t.id);save();re();toast('Eliminada')},'Eliminar')},
 nf(e){V.nf[e.dataset.k]=e.dataset.v;re()},
 nfDue(e,v){V.nf.due=addDays(todayISO(),+v);re()},
 addLink(){const l=$('#lk').value.trim();if(!isUrl(l))return toast('Escribe un enlace válido (https://…)');V.nf.links.push(l);re()},
 rmLink(e,v){V.nf.links.splice(v,1);re()},rmFile(e,v){V.nf.fnames.splice(v,1);re()},
 saveTask,
 notif(){try{if(!('Notification'in window))throw 0;Notification.requestPermission().then(p=>{D.notif=p==='granted';save();re();toast(D.notif?'Recordatorios activados':'Permiso denegado en este navegador');if(D.notif)reminders(true)})}catch(x){toast('Este navegador no permite notificaciones')}},
 mailRem(){const l=visibleTasks().filter(t=>t.status<2&&daysLeft(t.due)<=2);const body=l.map(t=>`• ${t.title} (${t.subject}) - ${fmt(t.due)}`).join('\n');showMail(D.session,'Recordatorio TASKA PRO',body||'Sin tareas próximas.')},
 calSel(e,v){V.cal=v;render()},calWeek(e,v){V.cal=addDays(V.cal,+v);render()},calToday(){V.cal=todayISO();render()},
 bf(e,v){V.boardF=v;render()},
 mv(e,v){const t=D.tasks.find(x=>x.id===e.dataset.id);t.status=Math.max(0,Math.min(2,t.status+ +v));save();re()},
 tt(e,v){V.teamTab=v;render()},selTeam(e){V.team=e.dataset.id;render()},
 newTeam(){modal(`<h2>Nuevo espacio de equipo</h2><input id="tn" placeholder="Nombre del equipo o proyecto"><button class="btn" style="margin-top:12px" data-a="saveTeam">Crear</button>`)},
 saveTeam(){const n=$('#tn').value.trim();if(!n)return;const t={id:uid(),name:n,code:code(),owner:D.session,members:[{name:me().name,email:D.session}],msgs:[]};D.teams.push(t);V.team=t.id;save();closeM();render();toast('Espacio creado. Código: '+t.code)},
 joinTeam(){modal(`<h2>Unirme a un equipo</h2><input id="jc" placeholder="Código del equipo" style="text-transform:uppercase"><button class="btn" style="margin-top:12px" data-a="doJoinTeam">Unirme</button>`)},
 doJoinTeam(){const c=$('#jc').value.trim().toUpperCase(),t=D.teams.find(x=>x.code===c);if(!t)return toast('Código no encontrado en este dispositivo');if(!t.members.some(m=>m.email===D.session))t.members.push({name:me().name,email:D.session});V.team=t.id;save();closeM();render();toast('Te uniste a '+t.name)},
 addMember(){modal(`<h2>Agregar integrante</h2><input id="mn" placeholder="Nombre"><input id="me" type="email" placeholder="Correo" style="margin-top:8px"><button class="btn" style="margin-top:12px" data-a="saveMember">Agregar</button><p class="sub" style="margin-top:10px">También puedes compartir el código con "Invitar".</p>`)},
 saveMember(){const t=D.teams.find(x=>x.id===V.team),n=$('#mn').value.trim(),m=$('#me').value.trim().toLowerCase();if(!n||!validEmail(m))return toast('Escribe nombre y un correo válido');if(t.members.some(x=>x.email===m))return toast('Ya está en el equipo');t.members.push({name:n,email:m});save();closeM();render();toast('Integrante agregado')},
 rmMember(e,v){const t=D.teams.find(x=>x.id===V.team);ask('¿Quitar a este integrante?',()=>{t.members=t.members.filter(m=>m.email!==v);D.tasks.forEach(x=>{if(x.teamId===t.id&&x.assignee===v)x.assignee=t.owner});save();render()},'Quitar')},
 shareTeam(){const t=D.teams.find(x=>x.id===V.team);modal(`<h2>Invitar al equipo</h2><p class="sub">Código: <b>${t.code}</b></p><input id="ie" type="email" placeholder="Correo del compañero"><button class="btn" style="margin-top:10px" data-a="mailTeam">✉ Invitar por correo</button><button class="btn sec" style="margin-top:8px" data-a="copyTxt" data-v="Únete a mi equipo ${esc(t.name)} en TASKA PRO con el código ${t.code}">📋 Copiar invitación</button>`)},
 mailTeam(){const t=D.teams.find(x=>x.id===V.team);showMail($('#ie').value.trim(),'Invitación a '+t.name+' en TASKA PRO',`Únete a mi equipo "${t.name}" en TASKA PRO con el código ${t.code}`)},
 delTeam(){const t=D.teams.find(x=>x.id===V.team);ask('¿Eliminar el espacio "'+t.name+'" y sus tareas?',()=>{D.tasks=D.tasks.filter(x=>x.teamId!==t.id);D.teams=D.teams.filter(x=>x.id!==t.id);V.team=null;save();render()},'Eliminar')},
 send(){const i=$('#chat'),x=i.value.trim();if(!x)return;const t=D.teams.find(z=>z.id===V.team);(t.msgs=t.msgs||[]).push({by:me().name,text:x,t:new Date().toLocaleString('es-MX',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'})});save();re()},
 /* Clases */
 newClass(){modal(`<h2>Crear clase</h2><input id="cn" placeholder="Nombre de la clase (ej. Matemáticas 3°B)"><button class="btn" style="margin-top:12px" data-a="saveClass">Crear</button>`)},
 saveClass(){const n=$('#cn').value.trim();if(!n)return;const c={id:uid(),name:n,code:code(),owner:D.session,members:[D.session],posts:[],subs:{}};D.classes.push(c);V.cls=c.id;save();closeM();render();toast('Clase creada. Código: '+c.code)},
 joinClass(){modal(`<h2>Unirme a una clase</h2><input id="jc" placeholder="Código de la clase" style="text-transform:uppercase"><button class="btn" style="margin-top:12px" data-a="doJoinClass">Unirme</button>`)},
 doJoinClass(){joinByCode($('#jc').value)},
 openClass(e){V.cls=e.dataset.id;render()},closeClass(){V.cls=null;render()},
 copyClass(e){const c=D.classes.find(x=>x.id===e.dataset.id);copy(`Únete a mi clase ${c.name} en TASKA PRO: código ${c.code} · ${BASE()}#clase-${c.code}`)},
 copyTxt(e,v){copy(v)},
 mailClass(e){const c=D.classes.find(x=>x.id===e.dataset.id);modal(`<h2>Invitar por correo</h2><input id="ie" type="email" placeholder="Correo del alumno"><button class="btn" style="margin-top:10px" data-a="sendMailClass" data-id="${c.id}">✉ Invitar</button>`)},
 sendMailClass(e){const c=D.classes.find(x=>x.id===e.dataset.id);showMail($('#ie').value.trim(),'Invitación a la clase '+c.name,`Únete a mi clase "${c.name}" en TASKA PRO con el código ${c.code} o este enlace: ${BASE()}#clase-${c.code}`)},
 delClass(e){ask('¿Eliminar esta clase?',()=>{D.classes=D.classes.filter(x=>x.id!==e.dataset.id);V.cls=null;save();render()},'Eliminar')},
 leaveClass(e){ask('¿Salir de la clase?',()=>{const c=D.classes.find(x=>x.id===e.dataset.id);c.members=c.members.filter(m=>m!==D.session);V.cls=null;save();render()},'Salir')},
 newPost(e){modal(`<h2>Publicar tarea</h2><input id="pt" placeholder="Título"><textarea id="pd" rows="3" placeholder="Instrucciones" style="margin-top:8px"></textarea><label>Fecha de entrega</label><input id="pf" type="date" value="${addDays(todayISO(),7)}"><button class="btn" style="margin-top:12px" data-a="savePost" data-id="${e.dataset.id}">Publicar</button>`)},
 savePost(e){const c=D.classes.find(x=>x.id===e.dataset.id),t=$('#pt').value.trim();if(!t)return toast('Escribe un título');c.posts.unshift({id:uid(),title:t,desc:$('#pd').value.trim(),due:$('#pf').value||addDays(todayISO(),7),by:D.session});save();closeM();render();toast('Tarea publicada')},
 delPost(e,v){ask('¿Eliminar esta tarea de la clase?',()=>{const c=D.classes.find(x=>x.id===e.dataset.id);c.posts=c.posts.filter(p=>p.id!==v);save();render()},'Eliminar')},
 doPost(e,v){const c=D.classes.find(x=>x.id===e.dataset.id),p=c.posts.find(x=>x.id===v),s=(c.subs[v]||{})[D.session]||{text:'',links:[],files:[]};V.post={c:c.id,p:v,links:[...s.links],files:[...s.files]};
  modal(`<h2>${esc(p.title)}</h2><p class="sub">${esc(p.desc)}</p><label>Tu trabajo</label><textarea id="st" rows="6" placeholder="Escribe aquí tu tarea…">${esc(s.text)}</textarea><label>Enlaces (Word, Docs, Canva…)</label><div class="row"><input id="sl" placeholder="https://…" style="flex:3"><button class="btn sm" data-a="subLink" style="flex:1">＋</button></div><input type="file" id="sf" multiple style="margin-top:8px"><div id="sl-list">${subList()}</div>
  <div class="row wrapr" style="margin-top:10px"><a class="app" style="padding:8px 12px" href="https://www.office.com/launch/word" target="_blank" rel="noopener">📝 Word</a><a class="app" style="padding:8px 12px" href="https://docs.google.com/document/" target="_blank" rel="noopener">📄 Docs</a><a class="app" style="padding:8px 12px" href="https://www.canva.com/" target="_blank" rel="noopener">🎨 Canva</a></div><button class="btn" style="margin-top:12px" data-a="submitPost">Entregar tarea</button>`)},
 subLink(){const l=$('#sl').value.trim();if(!isUrl(l))return toast('Enlace no válido');V.post.links.push(l);$('#sl').value='';$('#sl-list').innerHTML=subList()},
 rmSub(e,v){V.post.links.splice(v,1);$('#sl-list').innerHTML=subList()},
 submitPost(){const P=V.post,c=D.classes.find(x=>x.id===P.c);const f=$('#sf');for(const x of f.files)P.files.push(x.name);const text=$('#st').value.trim();if(!text&&!P.links.length&&!P.files.length)return toast('Agrega texto, enlace o archivo');(c.subs[P.p]=c.subs[P.p]||{})[D.session]={text,links:P.links,files:P.files,at:todayISO()};save();closeM();render();toast('Tarea entregada ✔')},
 viewSubs(e,v){const c=D.classes.find(x=>x.id===e.dataset.id),s=c.subs[v]||{},k=Object.keys(s);modal(`<h2>Entregas</h2>${k.length?k.map(m=>`<div class="card"><b>${esc(nameOf(m))}</b> <small class="m">${s[m].at}</small><p>${esc(s[m].text)}</p>${s[m].links.map(l=>`<div><a href="${esc(l)}" target="_blank" rel="noopener" style="color:#c9a6ff">🔗 ${esc(l.slice(0,40))}</a></div>`).join('')}${s[m].files.map(f=>`<div><small class="m">📎 ${esc(f)}</small></div>`).join('')}</div>`).join(''):'<div class="empty">Nadie ha entregado aún.</div>'}<button class="btn sec" data-a="closeM">Cerrar</button>`)},
 /* Apps */
 ai(e,v){const q=$('#q').value.trim();if(!q)return toast('Escribe qué quieres investigar');const u=encodeURIComponent(q);const url={chatgpt:'https://chatgpt.com/?q='+u,claude:'https://claude.ai/new?q='+u,gemini:'https://gemini.google.com/app',google:'https://www.google.com/search?q='+u}[v];
  modal(`<h2>Abrir ${v}</h2><p class="sub">${v==='gemini'?'Copia tu pregunta y pégala en Gemini.':'Tu pregunta va incluida.'}</p><a class="btn" href="${url}" target="_blank" rel="noopener" data-a="closeM">Abrir ahora ↗</a>${v==='gemini'?`<button class="btn sec" style="margin-top:8px" data-a="copyTxt" data-v="${esc(q)}">📋 Copiar pregunta</button>`:''}`)},
 saveLink(){const l=$('#lk2').value.trim(),f=$('#fl2');let n=0;if(l){if(!isUrl(l))return toast('Enlace no válido');(D.files[D.session]=D.files[D.session]||[]).push({name:l,link:l});n++}for(const x of f.files){(D.files[D.session]=D.files[D.session]||[]).push({name:x.name});n++}if(!n)return toast('Pega un enlace o elige un archivo');save();re();toast('Guardado')},
 rmFileLib(e,v){D.files[D.session].splice(v,1);save();re()},
 /* Perfil */
 saveName(){const n=$('#pn').value.trim();if(!n)return;me().name=n;save();re();toast('Nombre actualizado')},
 logout(){D.session=null;save();V.auth='login';render()},
 delAcc(){ask('¿Eliminar tu cuenta y tus tareas? No se puede deshacer.',()=>{const e=D.session;D.tasks=D.tasks.filter(t=>t.author!==e);D.users=D.users.filter(u=>u.email!==e);delete D.subjects[e];D.session=null;save();render()},'Eliminar')}
};
function subList(){const P=V.post;return P.links.map((l,i)=>`<div class="msgb">🔗 ${esc(l.slice(0,36))} <button class="x" data-a="rmSub" data-v="${i}">✕</button></div>`).join('')+P.files.map(f=>`<div class="msgb">📎 ${esc(f)}</div>`).join('')}
function copy(t){try{navigator.clipboard.writeText(t).then(()=>toast('Copiado ✔'),()=>modal(`<h2>Copia este texto</h2><textarea rows="4" readonly>${esc(t)}</textarea>`))}catch(e){modal(`<h2>Copia este texto</h2><textarea rows="4" readonly>${esc(t)}</textarea>`)}}
function showMail(to,sub,body){modal(`<h2>Mensaje listo</h2><p class="sub">Toca para abrir tu app de correo.</p><a class="btn" href="mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}">✉ Abrir correo</a><label>O copia el texto</label><textarea rows="4" readonly>${esc(sub+'\n\n'+body)}</textarea>`)}
function joinByCode(raw){const c=D.classes.find(x=>x.code===String(raw).trim().toUpperCase());if(!c)return toast('Código no encontrado en este dispositivo');if(!c.members.includes(D.session))c.members.push(D.session);V.cls=c.id;V.tab='classes';save();closeM();render();toast('Te uniste a '+c.name)}
function checkJoinHash(){const m=(location.hash||'').match(/^#clase-([A-Za-z0-9]+)$/);if(m&&D.session)setTimeout(()=>joinByCode(m[1]),200)}
function reminders(force){if(!D.notif||!D.session)return;try{const l=visibleTasks().filter(t=>t.status<2&&daysLeft(t.due)<=1&&(t.assignee===D.session||t.author===D.session));if(l.length&&(force||true))new Notification('TASKA PRO',{body:l.length+' tarea(s) vencen hoy o mañana: '+l[0].title})}catch(e){}}
setInterval(()=>reminders(false),3600000);

/* ===== Eventos ===== */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const f=A[b.dataset.a];if(!f)return;
 if(b.tagName==='A'&&b.dataset.a==='closeM'){closeM();return}
 f(b,b.dataset.v)});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.nf){V.nf[t.dataset.nf]=t.value;if(t.dataset.nf==='title'){const r=V.nf.title.trim()&&V.nf.subject;const btn=document.querySelector('[data-a=saveTask]');if(btn)btn.disabled=!r}}
 if(['em','pw','pw2'].includes(t.id))liveAuth()});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.nf==='due'||t.dataset.nf==='teamId'){V.nf[t.dataset.nf]=t.value;if(t.dataset.nf==='teamId'){const tm=D.teams.find(x=>x.id===t.value);V.nf.assignee=tm?(tm.members.some(m=>m.email===D.session)?D.session:tm.members[0].email):D.session}re()}
 if(t.dataset.a2==='calDate'&&t.value){V.cal=t.value;render()}
 if(t.id==='fl'){for(const x of t.files)V.nf.fnames.push(x.name);re()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!document.querySelector('#modal.show')){const t=e.target;if(t.id==='pw'||t.id==='em'){if(V.auth==='login')doLogin()}else if(t.id==='chat')A.send()}});
window.addEventListener('hashchange',checkJoinHash);
render();checkJoinHash();reminders(false);
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
</body>
